services:
  nestjs-api:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${API_HOST_PORT:-3000}:3000"
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Video worker (phase-03-videos/TD-05): same image and codebase as the API,
  # runs the BullMQ consumer with its own watch build output (dist-worker/).
  video-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "start:worker:dev"]
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: postgres:17
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "${MAILPIT_UI_HOST_PORT:-8025}:8025"

  redis:
    image: redis:8.2.10-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO community images are no longer published on Docker Hub/Quay;
  # Chainguard's source build is pinned by digest (phase-03-videos/TD-04).
  minio:
    image: cgr.dev/chainguard/minio@sha256:cee9a8e35885e93f14b3cb32960e5017aff74e2adfb52ba87c65003b0163886b
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY_ID:-streamtube}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_ACCESS_KEY:-streamtube-secret}
      - MC_CONFIG_DIR=/tmp/.mc
      - MC_HOST_local=http://${S3_ACCESS_KEY_ID:-streamtube}:${S3_SECRET_ACCESS_KEY:-streamtube-secret}@localhost:9000
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot bootstrap: creates the private video bucket, then exits.
  minio-init:
    image: cgr.dev/chainguard/minio@sha256:cee9a8e35885e93f14b3cb32960e5017aff74e2adfb52ba87c65003b0163886b
    entrypoint: ["mc"]
    command: ["mb", "--ignore-existing", "local/${S3_BUCKET:-streamtube-videos}"]
    environment:
      - MC_CONFIG_DIR=/tmp/.mc
      - MC_HOST_local=http://${S3_ACCESS_KEY_ID:-streamtube}:${S3_SECRET_ACCESS_KEY:-streamtube-secret}@minio:9000
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  redis-data:
  minio-data:
